  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="70" fill="#86efac" font-family="ui-sans-serif, system-ui" font-size="28" font-weight="600">Production Decision Intelligence</text>
  <text x="60" y="110" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="18">Multi-source data ’ analytics ’ exception signal ’ governed action</text>

  <g font-family="ui-sans-serif, system-ui" font-size="18" fill="#e2e8f0">
    <rect x="60" y="200" width="220" height="110" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="170" y="250" text-anchor="middle">Multi-source</text>
    <text x="170" y="278" text-anchor="middle">operational data</text>

    <path d="M290 255 L360 255" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="360,248 378,255 360,262" fill="#60a5fa"/>

    <rect x="390" y="200" width="220" height="110" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="500" y="250" text-anchor="middle">Analytics &amp;</text>
    <text x="500" y="278" text-anchor="middle">forecasting</text>

    <polygon points="620,248 638,255 620,262" fill="#60a5fa"/>
    <path d="M610 255 L620 255" stroke="#60a5fa" stroke-width="3"/>

    <rect x="650" y="200" width="220" height="110" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="760" y="250" text-anchor="middle">Exception</text>
    <text x="760" y="278" text-anchor="middle">signal</text>

    <polygon points="880,248 898,255 880,262" fill="#60a5fa"/>
    <path d="M870 255 L880 255" stroke="#60a5fa" stroke-width="3"/>

    <rect x="910" y="200" width="230" height="110" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="1025" y="250" text-anchor="middle">Governed</text>
    <text x="1025" y="278" text-anchor="middle">action</text>
